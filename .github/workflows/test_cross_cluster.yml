name: Cross-cluster test workflow
# Runs the cross-cluster integration tests against a leader and a follower cluster.
# Triggered on pull requests or pushes to any branch.
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:
  Get-CI-Image-Tag:
    # pinned to opensearch-build main (get-ci-image-tag.yml) instead of @main for supply-chain safety
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@9d5b8833de44966ef503339dfe390fb62aae0277
    with:
      product: opensearch

  cross-cluster-test:
    needs: Get-CI-Image-Tag
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    strategy:
      fail-fast: false
      matrix:
        # security on and off
        security_flag: ["", "-Dsecurity=true -Dhttps=true"]

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - name: Set Up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Checkout Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run cross-cluster integration tests
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew integTestCrossCluster ${{ matrix.security_flag }}"

      - name: Upload failed logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: logs-${{ matrix.security_flag != '' && 'security' || 'no-security' }}
          path: |
            build/testclusters/leaderCluster-*/logs/*
            build/testclusters/followCluster-*/logs/*
